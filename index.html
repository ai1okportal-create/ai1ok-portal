<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>AI1OK — закрите тестування</title>
    <style>
      :root { --ink:#102a43; --blue:#1769e0; --soft:#edf5ff; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; color:var(--ink); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; background:linear-gradient(135deg,#f7fbff 0%,var(--soft) 55%,#fff 100%); }
      main { width:min(680px,calc(100% - 48px)); padding:52px 0; }
      .brand { color:var(--blue); font-size:1.45rem; font-weight:850; letter-spacing:.08em; }
      .status { display:inline-block; margin-top:42px; padding:7px 11px; border-radius:999px; background:#dcecff; color:#1452a5; font-size:.86rem; font-weight:700; }
      h1 { margin:14px 0; font-size:clamp(2.5rem,7vw,4.7rem); line-height:1.02; letter-spacing:-.05em; }
      p { max-width:560px; color:#42607d; font-size:1.12rem; }
      footer { margin-top:54px; color:#58708a; font-size:.9rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">AI1OK</div>
      <div class="status">Закрите тестування</div>
      <h1>Авторський Індивідуальний 1 Онлайн-Кабінет</h1>
      <p>Платформа готується в закритому режимі. Доступ до майбутніх кабінетів надаватиметься лише після реєстрації та підтвердження.</p>
      <footer>© 2026 AI1OK</footer>
    </main>
  </body>
</html>
